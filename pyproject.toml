[project]
name = "agentic-ai-course"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "langchain (>=1.4.3,<2.0.0)",
    "langgraph (>=1.2.12,<2.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "langchain-google-genai (>=4.4.0,<5.0.0)",
    "langchain-core (>=1.6.6,<2.0.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "langchain-classic (>=1.0.8,<2.0.0)",
]

[tool.poetry]
packages = [{include = "agentic_ai_course", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
